spring.application.name=${APP_NAME:consulta-interestadual-veiculos}

# Todos os valores vem de variaveis de ambiente ou de server/.env (ignorado pelo git).
# Modelo com todas as variaveis em server/.env.example. O valor apos ":" e o padrao usado se a variavel nao existir.
spring.config.import=optional:file:.env[.properties]

# =========================
# Banco (Neon / PostgreSQL)
# =========================
# Obrigatorias (sem padrao): DB_URL no formato jdbc:postgresql://<host>/<database>?sslmode=require
# Alternativa (Render/Heroku): so DATABASE_URL=postgres://usuario:senha@host:porta/banco, sem DB_URL.
# Ela e convertida na inicializacao pelo DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# =========================
# JPA / Hibernate
# =========================
# O schema e criado por SQL e imutavel: manter "validate" (so confere o mapeamento, nunca altera o banco).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Sem sessao aberta na view: toda carga de relacionamento acontece dentro dos services (@Transactional).
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE:UTC}

# =========================
# Flyway
# =========================
# Desabilitado enquanto o banco estiver congelado. Para ativar: FLYWAY_ENABLED=true e scripts em db/migration.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# =========================
# Servidor / erros
# =========================
# O Render injeta PORT; localmente fica 8080
server.port=${PORT:8080}
# No deploy/restart, termina as requisicoes em andamento antes de desligar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
# Padroes seguros: nunca expor stacktrace, mensagem interna ou detalhes de binding no corpo do erro
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:never}
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-exception=${ERROR_INCLUDE_EXCEPTION:false}
server.error.whitelabel.enabled=${ERROR_WHITELABEL_ENABLED:false}

# =========================
# CORS
# =========================
# Origens separadas por virgula (ex.: dev do Vite em http://localhost:5173)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# Rate limit (/api/**)
# =========================
# Limite por cliente (IPv4 exato ou prefixo /64 do IPv6) em janela fixa de 1 minuto; acima disso 429 com Retry-After.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
# Contador separado e menor para /api/veiculos/** (consulta por placa, alvo de enumeracao)
app.rate-limit.placa-requests-per-minute=${RATE_LIMIT_PLACA_REQUESTS_PER_MINUTE:20}
# De onde vem o IP do cliente. Vazio (padrao) = IP da conexao. Atras de proxy (Render), informe um header que o
# proxy SOBRESCREVE com o IP real (ex.: CF-Connecting-IP). Para descobrir qual, rode com
# LOGGING_LEVEL_BACKEND_SECURITY=DEBUG e veja o log "Origem do IP". Nunca use X-Forwarded-For no Render:
# o proxy so acrescenta ao valor enviado pelo cliente, que pode forjar o proprio IP.
app.rate-limit.ip-header=${RATE_LIMIT_IP_HEADER:}
# Mantenha "none": o rate limit usa app.rate-limit.ip-header, e "native"/"framework" passariam a confiar no
# X-Forwarded-For (forjavel no Render).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# =========================
# Health check (Render)
# =========================
# So o health fica exposto, sem detalhes (nao revela versao, banco nem disco).
# /actuator/health/readiness = app pronta para receber trafego (usar no Render)
# /actuator/health = status geral, inclui a conexao com o banco
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# =========================
# OpenAPI / Swagger
# =========================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=${SWAGGER_PATH:/swagger-ui.html}
