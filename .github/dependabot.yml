# Abre PRs de atualizacao das dependencias. Os alertas de vulnerabilidade sao ligados em
# Settings > Code security (Dependabot alerts e Dependabot security updates).
version: 2
updates:
  # Dependencias Maven do backend (pom.xml em server/)
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Spring Boot e Spring Framework/Security sobem juntos num PR so
      spring:
        patterns:
          - "org.springframework*"
    # Salto de versao principal (ex.: Spring Boot 3 -> 4, springdoc 2 -> 3) exige migracao e fica
    # para uma tarefa propria. Versoes menores e correcoes (ex.: 3.5.16 -> 3.5.17) continuam chegando.
    ignore:
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc*"
        update-types: ["version-update:semver-major"]

  # Versoes das actions usadas nos workflows (.github/workflows/)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
